<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Attendance Workspace</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f4f6f8;
      }

      .container {
        width: 700px;
        max-width: 90%;
        margin: 50px auto;
        background: white;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
      }

      h1 {
        text-align: center;
        margin-bottom: 30px;
      }

      .date-section {
        display: flex;
        gap: 10px;
        margin-bottom: 30px;
      }

      .date-section input {
        flex: 1;
        padding: 12px;
        border: 1px solid #ccc;
        border-radius: 6px;
      }

      .search-btn {
        padding: 12px 20px;
        border: none;
        border-radius: 6px;
        background: #2563eb;
        color: white;
        cursor: pointer;
      }

      .search-btn:hover {
        background: #1d4ed8;
      }

      .student {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 18px 10px;
        border-bottom: 1px solid #ddd;
      }

      .student-name {
        font-size: 17px;
        font-weight: bold;
      }

      .options {
        display: flex;
        gap: 20px;
      }

      .options label {
        cursor: pointer;
      }

      .options input {
        cursor: pointer;
      }

      .status-present {
        color: #16a34a;
        font-weight: bold;
      }

      .status-absent {
        color: #dc2626;
        font-weight: bold;
      }

      .submit-btn {
        width: 100%;
        margin-top: 30px;
        padding: 14px;
        border: none;
        border-radius: 6px;
        background: #16a34a;
        color: white;
        font-size: 16px;
        cursor: pointer;
      }

      .submit-btn:hover {
        background: #15803d;
      }

      #message {
        text-align: center;
        margin-top: 20px;
        font-weight: bold;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h1>📋 Attendance Workspace</h1>

      <!-- DATE -->
      <div class="date-section">
        <input type="date" id="attendanceDate" />

        <button
          class="search-btn"
          onclick="displayAttendanceWithCondition()"
        >
          Search
        </button>
      </div>

      <!-- STUDENTS -->
      <div id="studentList">
        Select a date to load attendance.
      </div>

      <!-- SUBMIT -->
      <!-- Hidden initially. It will appear only when attendance doesn't exist -->
      <button
        id="submitAttendanceBtn"
        class="submit-btn"
        onclick="submitAttendance()"
        style="display: none"
      >
        Submit Attendance
      </button>

      <button onclick="findAverage()">Average of Students</button>

      <div id="message"></div>
    </div>

    <!-- Axios -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

    <!-- JavaScript -->
    <script src="index.js"></script>
  </body>
</html>
