<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Report</title>
    <link rel="stylesheet" href="report.css">
</head>
<body>

    <div class="report-container">

        <h2>Expense Report</h2>

        <div class="filters">
            <button class="filter-btn active" data-filter="daily">Daily</button>
            <button class="filter-btn" data-filter="weekly">Weekly</button>
            <button class="filter-btn" data-filter="monthly">Monthly</button>

            <button id="downloadBtn" class="download-btn">
                Download
            </button>
        </div>

        <h3 id="reportTitle">Day to Day Expenses</h3>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Description</th>
                        <th>Category</th>
                        <th>Income</th>
                        <th>Expense</th>
                    </tr>
                </thead>

                <tbody id="transactionTable"></tbody>

                <tfoot>
                    <tr>
                        <th colspan="3">Total</th>
                        <th id="totalIncome">₹0.00</th>
                        <th id="totalExpense">₹0.00</th>
                    </tr>

                    <tr>
                        <th colspan="3">Savings</th>
                        <th colspan="2" id="savings">₹0.00</th>
                    </tr>
                </tfoot>
            </table>
        </div>

    </div>

    <script src="report.js"></script>
</body>
</html>
