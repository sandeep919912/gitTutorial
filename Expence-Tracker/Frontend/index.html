<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expense Tracker</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <style>
      body {
        font-family: Arial, sans-serif;
      }

      .expense-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px;
      }

      .expense-item:last-child {
        border-bottom: none;
      }

      .expense-item button {
        background-color: #dc3545;
        color: white;
        border: none;
        padding: 5px 10px;
        cursor: pointer;
      }

      .premium-section {
        margin-top: 20px;
        text-align: center;
      }

      .premium {
        background: rgb(234, 215, 7);
        color: #fff;
        border: none;
        padding: 12px 32px;
        font-size: 1.05rem;
        font-weight: bold;
        border-radius: 30px;
        cursor: pointer;
        box-shadow: 0 4px 15px rgba(255, 165, 0, 0.35);
        transition:
          transform 0.15s ease,
          box-shadow 0.15s ease;
        letter-spacing: 0.5px;
      }

      .premium:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(255, 165, 0, 0.5);
      }

      .premium:active {
        transform: translateY(0);
      }

      .premium.active {
        background: linear-gradient(135deg, #4347b2, #8e9fe8);
        cursor: default;
        box-shadow: 0 4px 15px rgba(78, 84, 196, 0.4);
      }

      .premium:disabled {
        opacity: 1;
      }

      .premium-banner {
        margin-bottom: 10px;
        padding: 10px 14px;
        border-radius: 8px;
        font-weight: bold;
      }

      .premium-banner.text-success {
        background-color: rgba(25, 135, 84, 0.12);
        color: #198754;
      }

      .premium-banner.text-danger {
        background-color: rgba(220, 53, 69, 0.1);
        color: #dc3545;
      }

      .leaderboard {
        position: relative;
      }

      .close-leaderboard {
        position: absolute;
        top: 10px;
        right: 10px;
        border: none;
        background: transparent;
        font-size: 28px;
        cursor: pointer;
      }

      #askAI {
        position: fixed;
        bottom: 20px;
        right: 20px;
        background-color: #007bff;
        color: white;
        border: none;
        padding: 10px 20px;
        font-size: 16px;
        border-radius: 5px;
        cursor: pointer;
      }

      .history{
        display: flex;
        justify-content: space-between;
      }
    </style>
  </head>

  <body class="bg-light">
    <div class="container py-5">
      <div class="row justify-content-center">
        <div class="col-md-8">

          <!-- Expense Form -->
          <div class="card shadow">
            <div class="card-body">
              <h1 class="text-center mb-4">
                💰 Expense Tracker
              </h1>

              <form
                id="expenseForm"
                onsubmit="handleAddExpense(event)"
              >
                <div class="mb-3">
                  <label
                    for="expenseInput"
                    class="form-label"
                  >
                    Expense Amount
                  </label>

                  <input
                    type="number"
                    class="form-control"
                    id="expenseInput"
                    placeholder="Enter amount"
                    required
                  />
                </div>

                <div class="mb-3">
                  <label
                    for="descriptionInput"
                    class="form-label"
                  >
                    Description
                  </label>

                  <input
                    type="text"
                    class="form-control"
                    id="descriptionInput"
                    placeholder="Enter description"
                    required
                  />
                </div>

                <div class="mb-3">
                  <label
                    for="categorySelect"
                    class="form-label"
                  >
                    Category
                  </label>

                  <select
                    class="form-select"
                    id="categorySelect"
                  >
                    <option value="Food">
                      Food
                    </option>

                    <option value="Transportation">
                      Transportation
                    </option>

                    <option value="Entertainment">
                      Entertainment
                    </option>

                    <option value="Utilities">
                      Utilities
                    </option>

                    <option value="Other">
                      Others
                    </option>
                  </select>
                </div>

                <button
                  type="submit"
                  id="addExpenseButton"
                  class="btn btn-primary w-100"
                >
                  Add Expense
                </button>
              </form>
            </div>
          </div>


          <!-- Premium Section -->
          <div class="premium-section">
            <div
              id="premiumStatus"
              class="premium-banner d-none"
            ></div>

            <button
              id="premiumBtn"
              class="premium"
            >
              Be Premium
            </button>
          </div>


          <!-- Leaderboard -->
          <button
            id="forPremium"
            class="btn btn-warning mt-3"
          >
            Get All Expenses
          </button>

          <ul class="leaderboard"></ul>


          <!-- Total Expense -->
          <div class="card shadow mt-4">
            <div class="card-body text-center">
              <h4>
                Total Expense:
                ₹<span id="totalExpense">0</span>
              </h4>
            </div>
          </div>


          <!-- Expense History -->
          <div class="card shadow mt-4">
            <div class="card-body">

             <div class="history">
               <h3 class="mb-3">
                Expense History
              </h3>

              <h6>select raws : <select class="row-options">
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
              </select></h6>
             </div>

              <ul
                id="expenseList"
                class="list-group"
              ></ul>


              <!-- Pagination -->
              <div
                class="d-flex justify-content-center align-items-center gap-3 mt-4"
              >
                <button
                  id="prevBtn"
                  class="btn btn-secondary"
                  disabled
                >
                  Previous
                </button>

                <span
                  id="pageNumber"
                  class="fw-bold"
                >
                  Page 1
                </span>

                <button
                  id="nextBtn"
                  class="btn btn-primary"
                  disabled
                >
                  Next
                </button>
              </div>

            </div>
          </div>

        </div>
      </div>


      <!-- Ask AI -->
      <a href="genai.html">
        <button id="askAI">
          Ask AI
        </button>
      </a>

    </div>


    <!-- Cashfree -->
    <script src="https://sdk.cashfree.com/js/v3/cashfree.js"></script>

    <!-- Axios -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

    <!-- JavaScript -->
    <script src="script.js"></script>
  </body>
</html>
